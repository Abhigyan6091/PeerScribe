name: Formal Research Benchmark Suite

on:
  schedule:
    # Run nightly at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch: {}
  push:
    branches:
      - main
      - 'release/**'

jobs:
  run-empirical-experiments:
    name: Execute Experiments 1-7 (Research Benchmark)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: "Run Experiment 1: CRDT Partition Convergence Benchmark"
        run: npm run test:bench:crdt

      - name: "Run Experiment 2: Multi-Hop DTN Store-and-Forward Benchmark"
        run: npm run test:bench:dtn

      - name: "Run Experiment 3: Nostr Gateway Bridging Latency Benchmark"
        run: npm run test:bench:nostr

      - name: "Run Experiment 4: Edge AI Extraction & Schema Validity Benchmark"
        run: npm run test:bench:ai

      - name: "Run Experiment 6: Probabilistic Search Area Contraction Benchmark"
        run: npm run test:bench:search

      - name: "Execute and Record Empirical Benchmark Measurements"
        run: |
          mkdir -p benchmark-results
          node --experimental-strip-types --test tests/benchmarks/experiments.test.ts 2>&1 | tee benchmark-results/benchmark.log
          echo "### PeerScribe Empirical Benchmark Report" > benchmark-results/SUMMARY.md
          echo "- **Execution UTC:** $(date -u)" >> benchmark-results/SUMMARY.md
          echo "- **Git Commit:** $(git rev-parse HEAD)" >> benchmark-results/SUMMARY.md
          echo '```text' >> benchmark-results/SUMMARY.md
          cat benchmark-results/benchmark.log >> benchmark-results/SUMMARY.md
          echo '```' >> benchmark-results/SUMMARY.md

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4
        with:
          name: research-benchmark-summary
          path: benchmark-results/
          retention-days: 30
