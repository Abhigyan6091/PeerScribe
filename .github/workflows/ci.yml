name: PeerScribe Continuous Integration

on:
  push:
    branches: [ main, beta, 'feat/**', 'release/**' ]
  pull_request:
    branches: [ main, beta ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Shared Protocol Verification & Core Engine Tests
  # -------------------------------------------------------------
  shared-protocol-and-core:
    name: Protocol & Core Engine Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Validate Shared Protocol Schemas & Golden Fixtures
        run: npm run test:protocol

      - name: Run Core Engine, Adapters & Benchmark Experiments
        shell: bash
        run: |
          set -o pipefail
          if ! npm test 2>&1 | tee test.log; then
            ERR_MSG=$(tail -n 20 test.log | tr '\r\n' '  ')
            echo "::error title=Core Engine Test Failed::$ERR_MSG"
            tail -n 60 test.log
            exit 1
          fi

  # -------------------------------------------------------------
  # Job 2: Windows Electron Desktop Build & Packaging
  # -------------------------------------------------------------
  build-electron-windows:
    name: Windows Electron Build & Package
    needs: shared-protocol-and-core
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run Electron Unit & Isolation Tests
        run: npm run test:electron

      - name: Package Windows Electron Application
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: electron-builder
        run: |
          set -o pipefail
          if ! npm run package:electron 2>&1 | tee build.log; then
            ERR_MSG=$(tail -n 25 build.log | tr '\r\n' '  ')
            echo "::error title=Electron Package Failed::$ERR_MSG"
            exit 1
          fi

      - name: Stage Windows Artifacts
        shell: bash
        run: |
          mkdir -p artifacts-windows
          SETUP_EXE=$(find apps/desktop-electron/dist/ -name "*.exe" | head -n 1)
          if [ -z "$SETUP_EXE" ] || [ ! -f "$SETUP_EXE" ]; then
            echo "::error::Windows installer executable was not produced by electron-builder."
            exit 1
          fi
          cp "$SETUP_EXE" artifacts-windows/

          PORTABLE_ZIP=$(find apps/desktop-electron/dist/ -name "*.zip" | head -n 1)
          if [ -z "$PORTABLE_ZIP" ] || [ ! -f "$PORTABLE_ZIP" ]; then
            echo "::error::Windows portable archive was not produced by electron-builder."
            exit 1
          fi
          cp "$PORTABLE_ZIP" artifacts-windows/

          cp apps/desktop-electron/dist/*.blockmap artifacts-windows/ 2>/dev/null || true
          cp apps/desktop-electron/dist/*.yml artifacts-windows/ 2>/dev/null || true
          ls -la artifacts-windows/

      - name: Upload Windows Desktop Installer & Portable Package
        uses: actions/upload-artifact@v4
        with:
          name: PeerScribe-Windows-Desktop-CI
          path: artifacts-windows/
          retention-days: 14

  # -------------------------------------------------------------
  # Job 3: Android Flutter APK Build & Tests
  # -------------------------------------------------------------
  build-flutter-android:
    name: Android Flutter APK Build & Tests
    needs: shared-protocol-and-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 22.x (Cross-Platform Host Tests)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: apps/android-flutter
        run: flutter pub get

      - name: Analyze Flutter Source Code
        working-directory: apps/android-flutter
        run: |
          dart analyze --no-fatal-warnings > analyze_output.txt 2>&1 || {
            while IFS= read -r line; do
              if [ -n "$line" ]; then
                echo "::error title=Dart Analysis::$line"
              fi
            done < analyze_output.txt
            exit 1
          }

      - name: Run Flutter Unit, SQLite & Cross-Platform Integration Tests
        working-directory: apps/android-flutter
        shell: bash
        run: |
          set -o pipefail
          if ! flutter test --reporter expanded 2>&1 | tee flutter_test.log; then
            echo "::error title=Flutter Test Failed::$(grep -E 'ERROR|FAIL|Expected:|EXCEPTION|TypeError' flutter_test.log | head -n 10 | tr '\r\n' '  ')"
            grep -C 5 -E 'ERROR|FAIL|Expected:|EXCEPTION|TypeError' flutter_test.log || tail -n 80 flutter_test.log
            exit 1
          fi
          echo "=== Flutter & Integration Test Execution Verification ==="
          grep -E "(\+[0-9]+.*:.*|All tests passed!)" flutter_test.log | tail -n 25

      - name: Build Android Release APK (AOT Mode Verification)
        working-directory: apps/android-flutter
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build Android Debug APK (Development & Test Build)
        working-directory: apps/android-flutter
        run: flutter build apk --debug

      - name: Stage Android APK Artifacts & Strict Durability Verification
        shell: bash
        run: |
          mkdir -p artifacts-android
          RELEASE_APK="apps/android-flutter/build/app/outputs/flutter-apk/app-release.apk"
          DEBUG_APK="apps/android-flutter/build/app/outputs/flutter-apk/app-debug.apk"

          if [ ! -f "$RELEASE_APK" ] || [ ! -s "$RELEASE_APK" ]; then
            echo "::error::Release APK build verification failed: $RELEASE_APK is missing or zero-sized."
            exit 1
          fi
          # Unsigned release verification build: clearly distinguished from distributable signed release
          cp "$RELEASE_APK" artifacts-android/PeerScribe-Android-Release-Unsigned-v1.0.0.apk

          if [ ! -f "$DEBUG_APK" ] || [ ! -s "$DEBUG_APK" ]; then
            echo "::error::Debug APK build verification failed: $DEBUG_APK is missing or zero-sized."
            exit 1
          fi
          cp "$DEBUG_APK" artifacts-android/PeerScribe-Android-Debug-v1.0.0.apk

          echo "Verified Staged Android Artifacts:"
          ls -lh artifacts-android/

      - name: Upload Verified Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PeerScribe-Android-Mobile-CI
          path: artifacts-android/
          retention-days: 14
