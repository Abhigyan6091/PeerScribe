name: PeerScribe Official Release Pipeline

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic Version to Release (e.g. 1.0.0, 1.0.0-rc.1)'
        required: true
        default: '1.0.0'
      release_channel:
        description: 'Target Release Channel'
        required: true
        type: choice
        options:
          - stable
          - beta
          - alpha
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write
  packages: write

jobs:
  validate-and-test:
    name: Mandatory Quality Gates & Verification
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version_step.outputs.version }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Release Branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "::error::Official releases must be triggered strictly from the main branch."
            exit 1
          fi

      - name: Determine Version
        id: version_step
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            TAG=${GITHUB_REF#refs/tags/}
            VER=${TAG#v}
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Target Version: $VER"

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Full Monorepo Test Suite
        run: npm test

  build-windows-release:
    name: Build Windows Release Packages
    needs: validate-and-test
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Package Windows Electron Application
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run package:electron

      - name: Stage Windows Release Binaries
        shell: bash
        run: |
          mkdir -p release-windows
          VER="${{ needs.validate-and-test.outputs.release_version }}"
          SETUP_EXE=$(find apps/desktop-electron/dist/ -name "*.exe" | head -n 1)
          if [ -z "$SETUP_EXE" ] || [ ! -f "$SETUP_EXE" ]; then
            echo "::error::Official Windows installer (.exe) was not produced. Release gate failed."
            exit 1
          fi
          cp "$SETUP_EXE" "release-windows/PeerScribe-Windows-Setup-v${VER}.exe"

          PORTABLE_ZIP=$(find apps/desktop-electron/dist/ -name "*.zip" | head -n 1)
          if [ -z "$PORTABLE_ZIP" ] || [ ! -f "$PORTABLE_ZIP" ]; then
            echo "::error::Official Windows portable (.zip) was not produced. Release gate failed."
            exit 1
          fi
          cp "$PORTABLE_ZIP" "release-windows/PeerScribe-Windows-Portable-v${VER}.zip"

          cp apps/desktop-electron/dist/*.blockmap release-windows/ 2>/dev/null || true
          cp apps/desktop-electron/dist/*.yml release-windows/ 2>/dev/null || true
          ls -la release-windows/

      - name: Upload Windows Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: release-windows/

  build-android-release:
    name: Build Android Release APK
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies & Run Tests
        working-directory: apps/android-flutter
        run: |
          flutter pub get
          flutter test

      - name: Build Android Release APK
        working-directory: apps/android-flutter
        run: |
          flutter build apk --release

      - name: Stage Android Release APK
        run: |
          mkdir -p release-android
          VER="${{ needs.validate-and-test.outputs.release_version }}"
          RELEASE_APK="apps/android-flutter/build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$RELEASE_APK" ]; then
            echo "::error::Release APK ($RELEASE_APK) does not exist. Fallback to debug APK is strictly forbidden in official releases."
            exit 1
          fi
          cp "$RELEASE_APK" "release-android/PeerScribe-Android-v${VER}.apk"
          ls -la release-android/

      - name: Upload Android Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-binaries
          path: release-android/

  publish-github-release:
    name: Publish Official GitHub Release
    needs: [ validate-and-test, build-windows-release, build-android-release ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: release-assets

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-binaries
          path: release-assets

      - name: Verify Release Assets & Generate SHA-256 Checksums
        working-directory: release-assets
        run: |
          VER="${{ needs.validate-and-test.outputs.release_version }}"
          test -f "PeerScribe-Windows-Setup-v${VER}.exe" || { echo "::error::Missing Windows installer in release assets"; exit 1; }
          test -f "PeerScribe-Windows-Portable-v${VER}.zip" || { echo "::error::Missing Windows portable zip in release assets"; exit 1; }
          test -f "PeerScribe-Android-v${VER}.apk" || { echo "::error::Missing Android APK in release assets"; exit 1; }
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.validate-and-test.outputs.release_version }}"
          name: "PeerScribe Tactical Mesh v${{ needs.validate-and-test.outputs.release_version }}"
          draft: false
          prerelease: ${{ contains(needs.validate-and-test.outputs.release_version, 'alpha') || contains(needs.validate-and-test.outputs.release_version, 'beta') || contains(needs.validate-and-test.outputs.release_version, 'rc') }}
          files: |
            release-assets/*
          body: |
            ## PeerScribe Tactical Clinical Mesh v${{ needs.validate-and-test.outputs.release_version }}

            ### Included Distribution Packages:
            - **Windows Desktop:** `PeerScribe-Windows-Setup-v${{ needs.validate-and-test.outputs.release_version }}.exe` (NSIS Installer)
            - **Windows Portable:** `PeerScribe-Windows-Portable-v${{ needs.validate-and-test.outputs.release_version }}.zip`
            - **Android Mobile:** `PeerScribe-Android-v${{ needs.validate-and-test.outputs.release_version }}.apk`

            ### Verification & Integrity:
            All packages are verified against automated unit, projection, and causal reconciliation test suites before publication. Checksums are recorded in `SHA256SUMS.txt`.

            > **Medical Research Disclaimer:** PeerScribe is a decentralized disaster-coordination research prototype. Autonomous clinical prescription is strictly disabled.
